<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة طلاب الصحة العامة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#4c1d95;--p2:#7c3aed;--bg:#ece6ff;--card:#fff;--tx:#2e1065;--soft:#f3eeff;--ln:#d8ccff}
.dark{--bg:#150d2b;--card:#241546;--tx:#ece6ff;--soft:#2f1d5a;--ln:#4a3380}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);margin:4px 0 10px}
.hero{background:linear-gradient(160deg,#6d28d9,#3b0f8c);color:#fff;text-align:center;padding:22px 16px 36px;border-radius:0 0 50% 50%/0 0 34px 34px;position:relative}
.hero .ic{position:absolute;top:18px;width:44px;height:44px;background:rgba(255,255,255,.15);border-radius:14px;font-size:22px;color:#fff}
.ic.l{left:16px}.ic.r{right:16px}
.av{width:128px;height:128px;border-radius:50%;border:5px solid rgba(255,255,255,.6);box-shadow:0 0 0 6px rgba(167,139,250,.5);object-fit:cover;object-position:top;background:#fff;margin:6px auto 12px;display:block}
.hero h1{font-size:28px;font-weight:800;direction:ltr}.hero p{font-size:16px;font-weight:600;direction:ltr;opacity:.95}
.bar{margin:14px 14px 0;background:var(--card);border-radius:22px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px #7c3aed22;overflow:hidden}
.card{background:var(--card);border-radius:24px;padding:16px;margin:14px;box-shadow:0 6px 18px #7c3aed22}
.post{display:flex;gap:12px;align-items:center}.post img,.ph{width:42%;aspect-ratio:1;border-radius:16px;object-fit:cover;background:linear-gradient(135deg,#a78bfa,#6d28d9)}
.tag{display:inline-block;background:linear-gradient(90deg,#6d28d9,#4c1d95);color:#fff;border-radius:16px;padding:4px 14px;font-weight:700;font-size:14px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;margin:6px 0}
.btn{background:linear-gradient(90deg,#6d28d9,#4c1d95);color:#fff;border-radius:16px;padding:9px 18px;font-weight:700;display:inline-block;text-decoration:none;font-size:14px}
.btn.o{background:var(--soft);color:var(--tx)}.btn.r{background:#b91c1c}
.dots{text-align:center;margin-top:8px}.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ln);margin:0 3px}.dots i.on{background:var(--p2)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px}
.tile{background:linear-gradient(160deg,var(--card),var(--soft));border-radius:22px;padding:14px 4px;text-align:center;font-weight:800;box-shadow:0 4px 12px #7c3aed22;border:1px solid var(--ln)}
.tile b{display:block;font-size:38px;margin-bottom:4px}
.sup{display:block;margin:0 14px;background:linear-gradient(90deg,#6d28d9,#3b0f8c);color:#fff;border-radius:24px;padding:14px;text-align:center;font-weight:800;text-decoration:none}
.foot{text-align:center;font-size:12px;padding:18px 10px;opacity:.8}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#6d28d9,#3b0f8c);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:800}
.top button{background:rgba(255,255,255,.18);color:#fff;border-radius:12px;width:38px;height:38px;font-size:18px}
.pg{padding:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--card);border-radius:20px;padding:12px;box-shadow:0 4px 12px #7c3aed22;margin-bottom:12px}
.item img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:linear-gradient(135deg,#a78bfa,#6d28d9)}
.item h3{font-size:16px;margin:6px 0 2px}.item p{font-size:13px;opacity:.85;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px;border-radius:14px;background:var(--soft);font-weight:700}.tabs .on{background:var(--p2);color:#fff}
.opt{display:block;width:100%;text-align:start;background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:12px;margin:8px 0;font-weight:600}
.opt.sel{border-color:var(--p2);background:var(--soft)}.opt.ok{border-color:#16a34a;background:#16a34a22}.opt.no{border-color:#dc2626;background:#dc262622}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}.stat div{background:var(--soft);border-radius:16px;padding:10px}.stat b{font-size:22px;display:block}
.drawer{position:fixed;inset:0;background:#0008;z-index:10;display:flex}.drawer>div{width:280px;max-width:85%;background:var(--card);padding:18px;overflow:auto;height:100%}
.drawer button.m{display:block;width:100%;text-align:start;padding:12px;border-radius:14px;background:var(--soft);margin-bottom:8px;font-weight:700}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mem button{aspect-ratio:1;border-radius:14px;background:var(--p2);font-size:28px}.mem .up{background:var(--card);border:2px solid var(--p2)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.cg button{padding:14px 0;border-radius:12px;background:var(--soft);font-size:18px;font-weight:700}
.news .big{grid-column:1/-1}hr{border:0;border-top:1px solid var(--ln);margin:12px 0}
.res{background:var(--soft);border-radius:14px;padding:10px;margin-top:8px;font-weight:700}
.bar .mq{flex:1;overflow:hidden;direction:ltr;white-space:nowrap;border-inline-start:2px solid var(--ln);padding-inline-start:8px}
.bar .mq span{display:inline-block;padding-left:100%;animation:mql 22s linear infinite;font-weight:600;color:var(--p2)}
.mq.ar span{direction:rtl;animation-name:mqr}
@keyframes mql{to{transform:translateX(-100%)}}
@keyframes mqr{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){.bar .mq span{animation:none;padding:0}}
.card.post{display:block}.post img,.ph{width:100%;aspect-ratio:16/9;border-radius:16px;object-fit:cover;background:linear-gradient(135deg,#a78bfa,#6d28d9);margin-bottom:10px;display:block}
.long,.item p{white-space:pre-line;line-height:1.9;word-break:break-word}
.g1 .item img{aspect-ratio:16/9}
.best{background:var(--soft);border-radius:12px;padding:8px 10px;font-size:13px;margin:6px 0 10px;line-height:1.8}
.tabs{overflow-x:auto}.tabs button{white-space:nowrap;min-width:max-content}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 18px;border-radius:20px;z-index:30;font-size:14px}
.btn.big{display:block;width:100%;text-align:center;padding:14px;font-size:17px;border-radius:16px}.btn:disabled{opacity:.4}.btn.g{background:#16a34a}
.about{line-height:2.1}.about h2{margin-bottom:8px}.about p{margin:10px 0}.about blockquote{border-inline-start:4px solid var(--p2);background:var(--soft);padding:10px 14px;border-radius:12px;margin:12px 0;font-weight:700}
.about .dua{background:linear-gradient(135deg,#6d28d9,#3b0f8c);color:#fff;padding:16px;border-radius:18px;margin-top:14px}
.qh{display:flex;align-items:center;gap:10px;margin-bottom:10px}.pgb{flex:1;height:14px;background:var(--soft);border-radius:9px;overflow:hidden}.pgb i{display:block;height:100%;background:#16a34a;border-radius:9px;transition:width .4s}
.qq{margin:8px 0 14px;font-size:20px;line-height:1.7}.qn{opacity:.6;font-weight:700}.fire{display:inline-block;background:#f59e0b33;color:#b45309;border-radius:14px;padding:3px 12px;font-weight:800}
.qf{position:fixed;bottom:0;left:0;right:0;margin:auto;width:100%;max-width:520px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--ln);z-index:6}
.qf.ok{background:#dcfce7;color:#14532d}.qf.no{background:#fee2e2;color:#7f1d1d}.dark .qf.ok{background:#14532d;color:#dcfce7}.dark .qf.no{background:#7f1d1d;color:#fee2e2}
.qf .btn.big{margin-top:10px}.qf.ok .btn{background:#16a34a}.qf.no .btn{background:#dc2626}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto;background:conic-gradient(var(--p2) calc(var(--v)*1%),var(--soft) 0);display:grid;place-items:center;position:relative}.ring:before{content:'';position:absolute;inset:13px;background:var(--card);border-radius:50%}.ring b{position:relative;font-size:32px}
.conf{font-size:30px;animation:pop .8s}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.rv{border-inline-start:5px solid #16a34a}.rv.bad{border-color:#dc2626}.rv .a{font-size:14px;margin-top:4px}
.hud{display:flex;justify-content:space-between;font-size:20px;margin-bottom:8px}.cw{position:relative}canvas{width:100%;border-radius:16px;touch-action:none;display:block;background:#1e1b4b}
.ov{position:absolute;inset:0;background:#000b;color:#fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.tb{position:sticky;top:62px;z-index:4;display:flex;gap:4px;overflow-x:auto;background:var(--card);padding:6px;border-radius:12px;margin:8px 0;box-shadow:0 2px 8px #7c3aed22;align-items:center}
.tb button,.tb .cb,.tb select{flex:none;min-width:36px;height:36px;border-radius:9px;background:var(--soft);margin:0;padding:0 8px;width:auto;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.tb .cb input{width:24px;height:24px;padding:0;margin:0 0 0 4px;border:0}
.sheet{background:#fff;color:#000;min-height:65vh;padding:18px;border-radius:8px;box-shadow:0 4px 18px #0003;outline:0;line-height:1.9;overflow-wrap:anywhere}
.sheet table{border-collapse:collapse;width:100%}.sheet td,.sheet th{border:1px solid #888;padding:6px;min-width:36px}.sheet img{max-width:100%}
.xw{overflow:auto;max-height:58vh;border:1px solid var(--ln);border-radius:10px;background:var(--card)}.xt{border-collapse:collapse}.xt th{background:var(--soft);font-size:12px;padding:4px 8px;position:sticky;top:0;z-index:1}
.xt td{padding:0;border:1px solid var(--ln)}.xt input{width:92px;margin:0;border:0;border-radius:0;padding:9px 6px;font-size:14px}
.fd{font-size:13px;padding:4px 0;border-bottom:1px solid var(--ln)}.fd code{direction:ltr;display:inline-block;background:var(--soft);padding:0 6px;border-radius:6px}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;container-type:inline-size;border-radius:8px;box-shadow:0 4px 14px #0004;touch-action:none}
.el{position:absolute;box-sizing:border-box}.el.sel{outline:2px dashed #7c3aed}.el .tx{width:100%;height:100%;overflow:hidden;outline:0;line-height:1.4}.el img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.hd{position:absolute;right:-9px;bottom:-9px;width:20px;height:20px;background:#7c3aed;border-radius:50%;display:none;touch-action:none}.sel .hd{display:block}
.pill{min-width:36px;height:36px;border-radius:50%;background:var(--soft);font-weight:800;flex:none}.pill.on{background:var(--p2);color:#fff}
.pres{position:fixed;inset:0;background:#000;z-index:20;display:grid;place-items:center}.pres .stage{width:min(100vw,177vh);border-radius:0}.pres .x{position:absolute;top:10px;right:10px;background:#fff3;color:#fff;width:40px;height:40px;border-radius:50%;z-index:2}
.pj{display:flex;flex-direction:column;gap:8px}.pbar{height:12px;background:var(--soft);border-radius:8px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;padding:6px 0}.chart i{flex:1;background:linear-gradient(#a78bfa,#6d28d9);border-radius:8px 8px 0 0;min-height:4px;position:relative}.chart i b{position:absolute;top:-18px;width:100%;text-align:center;font-size:11px}
.bdg{display:inline-flex;flex-direction:column;align-items:center;width:30%;margin:4px 1%;padding:8px 2px;border-radius:14px;background:var(--soft);font-size:11px;text-align:center}.bdg b{font-size:28px}.bdg.off{opacity:.3;filter:grayscale(1)}
@media print{body{background:#fff}.top,.tb,.noprint,.row{display:none!important}.pg{padding:0}.sheet{box-shadow:none;border-radius:0;padding:0}}
</style>
</head>
<body><div id="app"></div>
<script src="data.js"></script>
<script>
/* ---------- الحالة والتخزين المحلي ---------- */
const load=(k,d)=>{try{return JSON.parse(localStorage[k])||d}catch(e){return d}};
let S=load('ph_set',{theme:'light',lang:'ar'}),U=load('ph_user',null),ST=load('ph_stat',{pts:0,games:0,hist:[]});
const save=()=>{localStorage.ph_set=JSON.stringify(S);localStorage.ph_user=JSON.stringify(U);localStorage.ph_stat=JSON.stringify(ST)};
const T={ar:{quiz:'الاختبارات',lib:'المكتبة',kit:'حزمة أدوات',games:'ألعاب',news:'نشرة الصحة',tools:'أدوات',sup:'الدعم الفني',latest:'آخر منشور',all:'قراءة كل المنشورات',about:'عن الموقع',set:'الإعدادات',dark:'الوضع الليلي / النهاري',lang:'English',back:'رجوع',prof:'الملف الشخصي',home:'الرئيسية',rights:'جميع الحقوق محفوظة لطالبة',start:'ابدأ اختبار',read:'قراءة',dl:'تحميل',open:'فتح',posts:'المنشورات'},
en:{quiz:'Quizzes',lib:'Library',kit:'Toolkit',games:'Games',news:'Health Bulletin',tools:'Tools',sup:'Support',latest:'Latest post',all:'Read all posts',about:'About',set:'Settings',dark:'Dark / Light mode',lang:'العربية',back:'Back',prof:'Profile',home:'Home',rights:'All rights reserved for student',start:'Start quiz',read:'Read',dl:'Download',open:'Open',posts:'Posts'}};
const t=k=>T[S.lang][k]||k, $=s=>document.querySelector(s), app=$('#app');
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=(s,c='')=>`<img class="${c}" src="${s}" alt="" onerror="this.removeAttribute('src')">`;
const sorted=()=>[...POSTS].sort((a,b)=>b.date.localeCompare(a.date));
let stack=[['home']],timer=null,pi=0,cl=null,guard=null,ig=false,lastBack=0,raf=0;
const L=(a,e)=>S.lang=='ar'?a:e;
function theme(){document.body.parentElement.className=S.theme;document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=='ar'?'rtl':'ltr'}
function cleanup(){clearInterval(timer);if(cl)cl();cl=null;guard=null;document.querySelectorAll('.pres').forEach(e=>e.remove())}
function draw(){cleanup();const[v,a]=stack[stack.length-1];V[v](a);scrollTo(0,0)}
function go(v,a){stack.push([v,a]);history.pushState(0,'');draw()}
function back(){if(stack.length>1)history.back()}
function toHome(){const n=stack.length-1;stack=[['home']];if(n>0){ig=true;history.go(-n)}else draw()}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),1800)}
/* زر رجوع الهاتف: كل صفحة تُسجَّل في سجل المتصفح، وزر الرجوع يغلق القائمة/العرض أولاً ثم يرجع صفحة */
addEventListener('popstate',()=>{
if(ig){ig=false;draw();return}
const ov=document.querySelector('.drawer,.pres');if(ov){ov.remove();history.pushState(0,'');return}
if(stack.length>1){if(guard&&!guard()){history.pushState(0,'');return}stack.pop();draw();return}
if(Date.now()-lastBack<2000){history.back();return}
lastBack=Date.now();toast(L('اضغط رجوع مرة أخرى للخروج','Press back again to exit'));history.pushState(0,'')});
history.replaceState(0,'');history.pushState(0,'');
function page(title,body){app.innerHTML=`<div class="top"><button onclick="back()">${S.lang=='ar'?'›':'‹'}</button><span>${title}</span></div><div class="pg">${body}</div>`}
const dk0=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addPts=(p,g)=>{ST.pts+=p;if(g)ST.games++;ST.days=ST.days||[];const k=dk0(new Date());if(!ST.days.includes(k))ST.days.push(k);save()};

/* ---------- الصفحات ---------- */
const V={};
V.home=()=>{const ps=sorted().slice(0,3),p=ps[pi%ps.length],tk=(Array.isArray(TICKER)?TICKER.filter(x=>/[\u0600-\u06FF]/.test(x)==(S.lang=='ar')):TICKER[S.lang]||[]).join('   ✦   ');
app.innerHTML=`<div class="hero"><button class="ic l" onclick="menu()">☰</button><button class="ic r" onclick="go('profile')">👤</button>
${img(SITE.photo,'av')}<h1>${SITE.name}</h1><p>${SITE.uni}</p><p>${SITE.fac} • ${SITE.batch}</p></div>
<div class="bar"><span style="font-size:24px">📣</span><div class="mq ${S.lang}"><span style="animation-duration:${Math.max(14,tk.length*.28)}s">${esc(tk)}</span></div></div>
<div class="card post">${img(p.image,'ph')}<span class="tag">${t('latest')}</span><h3 style="margin-top:8px">${esc(p.title)}</h3><div class="long">${esc(p.text)}</div><button class="btn" style="margin-top:10px" onclick="go('posts')">${t('all')}</button>
<div class="dots">${ps.map((_,i)=>`<i class="${i==pi%ps.length?'on':''}" onclick="pi=${i};V.home()"></i>`).join('')}</div></div>
<div class="tiles">${[['quiz','📋'],['lib','📖'],['kit','🧰'],['games','🎮'],['news','📰'],['tools','⚙️']].map(([k,e])=>`<button class="tile" onclick="go('${k}')"><b>${e}</b>${t(k)}</button>`).join('')}</div>
<a class="sup" href="mailto:${SITE.email}">🎧 ${t('sup')}</a>
<div class="foot">© 2026 ${SITE.name} — ${t('rights')}</div>`};

function menu(){const d=document.createElement('div');d.className='drawer';d.onclick=e=>{if(e.target==d)d.remove()};
d.innerHTML=`<div><h3>${t('home')}</h3><br>${['quiz','lib','kit','games','news','tools'].map(k=>`<button class="m" data-g="${k}">${t(k)}</button>`).join('')}<button class="m" data-g="about">ℹ️ ${t('about')}</button><hr><h4>${t('set')}</h4><br><button class="m" id="th">🌙 ${t('dark')}</button><button class="m" id="lg">🌐 ${t('lang')}</button></div>`;
document.body.append(d);d.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{d.remove();go(b.dataset.g)});
$('#th').onclick=()=>{S.theme=S.theme=='dark'?'light':'dark';save();theme()};$('#lg').onclick=()=>{S.lang=S.lang=='ar'?'en':'ar';save();theme();d.remove();V.home()}}
V.about=()=>page(t('about'),`<div class="card about" style="margin:0">${S.lang=='ar'?`<h2>🌿 منصة طلاب الصحة العامة</h2>
<p>هذه المنصة مقدَّمة من <b>عرفة الدود</b> لدعم طلاب كلية الصحة العامة بجامعة الزعيم الأزهري، الدفعة 31، لتكون رفيقاً لكم في الاختبارات والمراجع والأدوات، ومكاناً يجمع ما تحتاجونه في رحلتكم.</p>
<h3>يا طالب الصحة العامة .. أنت على ثغر عظيم</h3>
<p>أنت لا تدرس لتنجح في امتحان فحسب، بل تتعلّم كيف تخدم خلق الله وتحفظ سلامتهم. كل طفل يُطعَّم، وكل أسرة تشرب ماءً نظيفاً، وكل مجتمع ينجو من وباء، وراءه طالب صحة عامة اجتهد في صمت. وهذا لعمري عملٌ عظيم يدعو للفخر والاستمرار، فمن خدم الناس في صحتهم فقد أدخل السرور على قلوب كثيرة.</p>
<p>قد تبدو الجامعة صعبة، وقد تثقل عليك المواد والسهر وخوف النتائج، لكن اعلم أن طريق القمة لم يكن يوماً سهلاً. وقد تكون البداية متعثّرة عقيمة لا ثمرة فيها، غير أن النهايات العظيمة تُصنع من بدايات صغيرة صبر عليها أصحابها. لا تقارن خطواتك بخطوات غيرك، ولا تستسلم إن تعثّرت؛ فالسقوط ليس النهاية، التوقف وحده هو النهاية.</p>
<blockquote>﴿فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾</blockquote>

${last.length?`<div class="card" style="margin:12px 0"><h3>📈 ${L('آخر نتائجك','Recent results')}</h3><div class="chart" style="padding-top:20px">${last.map(x=>`<i style="height:${Math.max(4,x.pc)}%"><b>${x.pc}</b></i>`).join('')}</div></div>`:''}
${sa.length?`<div class="card" style="margin:12px 0"><h3>📚 ${L('أداؤك حسب المادة','By subject')}</h3>${sa.map(([n,a,c])=>`<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><b>${esc(n)}</b><span>${a}% • ${c}×</span></div><div class="pbar"><i style="width:${a}%;background:${a>=70?'#16a34a':a>=50?'#f59e0b':'#dc2626'}"></i></div></div>`).join('')}<div class="best">💪 ${L('الأقوى','Strongest')}: <b>${esc(sa[0][0])}</b>${sa.length>1?` • 🎯 ${L('تحتاج مراجعة','Needs review')}: <b>${esc(sa[sa.length-1][0])}</b>`:''}</div></div>`:''}
<div class="card" style="margin:12px 0"><h3>🏅 ${L('الإنجازات','Achievements')}</h3><div>${bd.map(([ok,e,n])=>`<span class="bdg ${ok?'':'off'}"><b>${e}</b>${n}</span>`).join('')}</div></div>
<h3 style="margin:14px 0 6px">${L('سجل الاختبارات','Quiz history')}</h3>${h.slice().reverse().map(x=>`<div class="item"><div class="row" style="justify-content:space-between"><b>${esc(x.n)}</b><span class="tag">${x.pc}%</span></div><small>${x.c}/${x.t} • ${x.d}${x.xp?` • +${x.xp} XP`:''}</small></div>`).join('')||`<p>${L('لا توجد اختبارات بعد.','No quizzes yet.')}</p>`}</div>
<div class="row" style="margin-top:12px"><button class="btn" onclick="go('pedit')">✏️ ${L('تعديل','Edit')}</button><button class="btn o" id="rp">⬇️ ${L('تنزيل التقرير','Download report')}</button><button class="btn o" onclick="print()">🖨️ PDF</button><button class="btn r" id="del">${L('حذف الحساب','Delete account')}</button></div>`);
$('#rp').onclick=()=>dl('report.html','text/html',`<!DOCTYPE html><html dir="${S.lang=='ar'?'rtl':'ltr'}"><head><meta charset="utf-8"><title>${esc(U.n)}</title><style>body{font-family:Cairo,Arial,sans-serif;max-width:640px;margin:20px auto;padding:10px;line-height:1.8}.card,.item{border:1px solid #ddd;border-radius:14px;padding:12px;margin:10px 0}.stat{display:flex;gap:8px;text-align:center}.stat div{flex:1;background:#f3eeff;border-radius:12px;padding:8px}.stat b{display:block;font-size:20px}.pbar{height:10px;background:#eee;border-radius:6px}.pbar i{display:block;height:100%;background:#7c3aed;border-radius:6px}.chart{display:flex;align-items:flex-end;height:100px;gap:4px}.chart i{flex:1;background:#7c3aed;position:relative}.chart b{position:absolute;top:-16px;font-size:11px}.bdg{display:inline-block;margin:3px;padding:6px 10px;background:#f3eeff;border-radius:10px}.bdg.off{opacity:.3}</style></head><body>${$('#rep').innerHTML}</body></html>`);
$('#del').onclick=()=>{if(confirm(L('حذف الحساب وكل النشاط؟','Delete the account and all activity?'))){U=null;ST={pts:0,games:0,hist:[],days:[]};save();toHome()}}};
V.pedit=()=>{page(L('تعديل','Edit'),form(U));bindForm()};

theme();V.home();
</script>
</body>
</html>
